<!--
  ==========================================================================
   NECHIMOTOS CRM · StyleCss.html
   CSS3 nativo moderno (sin Bootstrap):
     · CSS Custom Properties con tema claro/oscuro accesible
     · CSS Grid + Flexbox, responsive-first (móvil del asesor primero)
     · Componentes: tarjetas KPI, tablas, badges de estado, modales, toasts
  ==========================================================================
-->
<style>
  /* ---------- 1. TOKENS DE DISEÑO ------------------------------------- */
  :root {
    --brand:        #e11d2a;   /* rojo corporativo Nechimotos */
    --brand-dark:   #b3141f;
    --brand-soft:   rgba(225, 29, 42, .12);

    --bg:           #f4f6fb;
    --surface:      #ffffff;
    --surface-2:    #f9fafb;
    --border:       #e3e8ef;
    --text:         #10151f;
    --text-soft:    #5b6577;

    --ok:           #0f9d58;
    --ok-soft:      rgba(15, 157, 88, .14);
    --warn:         #d97706;
    --warn-soft:    rgba(217, 119, 6, .14);
    --info:         #2563eb;
    --info-soft:    rgba(37, 99, 235, .14);
    --danger:       #dc2626;
    --danger-soft:  rgba(220, 38, 38, .14);

    --radius:       14px;
    --radius-sm:    9px;
    --shadow:       0 1px 2px rgba(16,21,31,.06), 0 8px 24px rgba(16,21,31,.07);
    --shadow-lg:    0 24px 60px rgba(16,21,31,.22);
    --sidebar-w:    248px;
    --font: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  }

  [data-theme="dark"] {
    --bg:        #0d1117;
    --surface:   #161b22;
    --surface-2: #1c232d;
    --border:    #2a323d;
    --text:      #e8edf5;
    --text-soft: #97a3b6;
    --shadow:    0 1px 2px rgba(0,0,0,.5), 0 10px 26px rgba(0,0,0,.45);
  }

  /* ---------- 2. RESET ------------------------------------------------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: var(--font); background: var(--bg); color: var(--text);
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4 { margin: 0; font-weight: 650; letter-spacing: -.01em; }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

  /* ---------- 3. LOGIN -------------------------------------------------- */
  .login-wrap {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background:
      radial-gradient(900px 480px at 12% -10%, var(--brand-soft), transparent 60%),
      radial-gradient(760px 420px at 110% 110%, rgba(37,99,235,.16), transparent 60%),
      var(--bg);
  }
  .login-card {
    width: min(100%, 410px); background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; box-shadow: var(--shadow-lg); padding: 34px 30px;
  }
  .brand-mark {
    display: flex; align-items: center; gap: 12px; margin-bottom: 22px;
  }
  .brand-logo {
    width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--brand), var(--brand-dark));
    color: #fff; font-weight: 800; font-size: 19px; letter-spacing: -.5px;
  }
  .brand-name { font-size: 19px; font-weight: 750; }
  .brand-sub { font-size: 12.5px; color: var(--text-soft); }

  /* ---------- 4. LAYOUT APP -------------------------------------------- */
  .app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }

  .sidebar {
    background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 6px; padding: 18px 14px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .side-head { display: flex; align-items: center; gap: 10px; padding: 4px 6px 16px; }
  .nav-btn {
    display: flex; align-items: center; gap: 11px; width: 100%; padding: 11px 13px;
    border: 0; background: transparent; border-radius: var(--radius-sm); cursor: pointer;
    color: var(--text-soft); font-weight: 560; text-align: left; transition: .16s;
  }
  .nav-btn:hover { background: var(--surface-2); color: var(--text); }
  .nav-btn.active { background: var(--brand-soft); color: var(--brand); font-weight: 680; }
  .nav-btn .ico { font-size: 17px; width: 20px; text-align: center; }
  .nav-badge {
    margin-left: auto; background: var(--brand); color: #fff; border-radius: 999px;
    font-size: 11px; font-weight: 700; padding: 1px 7px; min-width: 20px; text-align: center;
  }
  .side-foot { margin-top: auto; border-top: 1px solid var(--border); padding-top: 12px; }

  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    display: flex; align-items: center; gap: 12px; padding: 14px 22px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 30;
  }
  .topbar h1 { font-size: 18px; }
  .topbar .spacer { flex: 1; }
  .content { padding: 22px; display: grid; gap: 20px; }
  .view { display: grid; gap: 18px; animation: fade .22s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .menu-toggle { display: none; }

  /* ---------- 5. COMPONENTES ------------------------------------------- */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px;
  }
  .card-head {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
  }
  .card-head h3 { font-size: 15.5px; }
  .card-head .spacer { flex: 1; }
  .muted { color: var(--text-soft); font-size: 13px; }

  .kpi-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); }
  .kpi {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 17px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .kpi::after {
    content: ''; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--brand);
  }
  .kpi.ok::after    { background: var(--ok); }
  .kpi.warn::after  { background: var(--warn); }
  .kpi.info::after  { background: var(--info); }
  .kpi-label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-soft); }
  .kpi-value { font-size: 30px; font-weight: 760; line-height: 1.15; margin-top: 4px; }
  .kpi-foot { font-size: 12.5px; color: var(--text-soft); margin-top: 2px; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .field { display: grid; gap: 5px; min-width: 150px; flex: 1 1 160px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--text-soft); }
  input, select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface-2); color: var(--text); outline: none; transition: .15s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); background: var(--surface);
  }
  textarea { resize: vertical; min-height: 74px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 16px; border-radius: var(--radius-sm); border: 1px solid transparent;
    background: var(--brand); color: #fff; font-weight: 640; cursor: pointer; transition: .16s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--brand-dark); transform: translateY(-1px); }
  .btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
  .btn.ghost { background: transparent; border-color: var(--border); color: var(--text); }
  .btn.ghost:hover { background: var(--surface-2); }
  .btn.ok { background: var(--ok); }
  .btn.warnb { background: var(--warn); }
  .btn.danger { background: var(--danger); }
  .btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 7px; }
  .btn.block { width: 100%; }
  .icon-btn {
    width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface); cursor: pointer;
  }
  .icon-btn:hover { background: var(--surface-2); }

  /* Tablas */
  .table-wrap { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead th {
    position: sticky; top: 0; background: var(--surface-2); text-align: left;
    padding: 11px 12px; font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase;
    color: var(--text-soft); border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--surface-2); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .empty { padding: 34px; text-align: center; color: var(--text-soft); }

  /* Badges de estado */
  .badge {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px;
    font-size: 11.5px; font-weight: 680; white-space: nowrap;
  }
  .badge.disponible   { background: var(--ok-soft);    color: var(--ok); }
  .badge.traslado     { background: var(--warn-soft);  color: var(--warn); }
  .badge.consignacion { background: var(--info-soft);  color: var(--info); }
  .badge.test         { background: var(--brand-soft); color: var(--brand); }
  .badge.neutro       { background: var(--surface-2);  color: var(--text-soft); border: 1px solid var(--border); }
  .badge.rojo         { background: var(--danger-soft); color: var(--danger); }
  .badge.tvs          { background: var(--brand-soft); color: var(--brand); }
  .badge.mobility     { background: var(--info-soft);  color: var(--info); }

  /* Gráficos CSS (sin librerías externas) */
  .bars { display: grid; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: minmax(96px, 30%) 1fr auto; align-items: center; gap: 10px; }
  .bar-label { font-size: 12.5px; color: var(--text-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { background: var(--surface-2); border-radius: 999px; height: 12px; overflow: hidden; }
  .bar-fill {
    height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--brand), #f97316);
    transition: width .5s cubic-bezier(.2,.8,.2,1);
  }
  .bar-fill.azul { background: linear-gradient(90deg, var(--info), #06b6d4); }
  .bar-value { font-size: 12.5px; font-weight: 700; min-width: 34px; text-align: right; }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(8, 12, 20, .55); backdrop-filter: blur(3px);
    display: grid; place-items: center; padding: 18px; z-index: 80;
  }
  .modal {
    width: min(100%, 560px); max-height: 90vh; overflow-y: auto; background: var(--surface);
    border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow-lg); padding: 22px;
  }
  .modal h3 { font-size: 17px; margin-bottom: 4px; }
  .form-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); margin-top: 16px; }
  .form-grid .full { grid-column: 1 / -1; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }

  /* Toasts */
  .toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 10px; z-index: 120; }
  .toast {
    background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--info);
    border-radius: 11px; box-shadow: var(--shadow-lg); padding: 12px 15px; min-width: 250px;
    max-width: 340px; animation: slidein .2s ease;
  }
  .toast.ok { border-left-color: var(--ok); }
  .toast.err { border-left-color: var(--danger); }
  .toast.warn { border-left-color: var(--warn); }
  .toast strong { display: block; font-size: 13.5px; }
  .toast span { font-size: 12.5px; color: var(--text-soft); }
  @keyframes slidein { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }

  /* Loader */
  .loader { display: inline-block; width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.4);
    border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
  .loader.dark { border-color: var(--border); border-top-color: var(--brand); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .skeleton { height: 14px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-2), var(--border), var(--surface-2));
    background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  .grid-2 { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); }
  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--border); background: var(--surface-2); border-radius: 999px;
    padding: 5px 12px; font-size: 12.5px; cursor: pointer; transition: .15s;
  }
  .chip.active { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 640; }

  /* ---------- 6. RESPONSIVE -------------------------------------------- */
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .sidebar {
      position: fixed; inset: 0 auto 0 0; width: 82vw; max-width: 300px; z-index: 90;
      transform: translateX(-100%); transition: transform .22s ease; box-shadow: var(--shadow-lg);
    }
    .sidebar.open { transform: none; }
    .menu-toggle { display: grid; }
    .content { padding: 14px; }
    .topbar { padding: 12px 14px; }
    .kpi-value { font-size: 25px; }
    table { font-size: 12.8px; }
    thead th, tbody td { padding: 9px 10px; }
  }
  @media (max-width: 520px) {
    .toolbar .field { flex: 1 1 100%; }
    .modal { padding: 18px; }
    .toasts { left: 12px; right: 12px; }
    .toast { max-width: none; }
  }
  @media print {
    .sidebar, .topbar, .toolbar, .btn { display: none !important; }
    .app { grid-template-columns: 1fr; }
    .card { box-shadow: none; border-color: #ccc; }
  }
</style>
